name: Release package

# A package published beside codemode has a version of its own and is
# released by a tag of its own: `codemode-bash@1.2.0` publishes
# packages/codemode-bash at version 1.2.0. Codemode itself is released by a
# `v*` tag, in release.yml.
on:
  push:
    tags:
      - "codemode-*@*"

permissions:
  contents: write

concurrency:
  # Serialize package releases so two tags can't race on the same npm package.
  group: release-package
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag matches a package that can be installed
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PACKAGE="${TAG%@*}"
          VERSION="${TAG##*@}"
          MANIFEST="packages/$PACKAGE/package.json"
          if ! echo "$PACKAGE" | grep -qE '^codemode-[a-z0-9-]+$' || [ ! -f "$MANIFEST" ]; then
            echo "::error::tag $TAG names no package under packages/"
            exit 1
          fi
          field() { node -p "require('./$MANIFEST')$1 ?? ''"; }
          if [ "$(field .private)" = "true" ]; then
            echo "::error::$PACKAGE is private and is not published"
            exit 1
          fi
          if [ "$(field .name)" != "@shiftlabs/$PACKAGE" ]; then
            echo "::error::$MANIFEST is named $(field .name), not @shiftlabs/$PACKAGE"
            exit 1
          fi
          if [ "$(field .version)" != "$VERSION" ]; then
            echo "::error::$MANIFEST is at version $(field .version), not the tag's $VERSION"
            exit 1
          fi
          # A package is installable only beside a published codemode its peer range takes.
          RANGE="$(field ".peerDependencies?.['@shiftlabs/codemode']")"
          if [ -z "$RANGE" ] || ! npm view "@shiftlabs/codemode@$RANGE" version > /dev/null 2>&1; then
            echo "::error::no published @shiftlabs/codemode satisfies the peer range '$RANGE' of $PACKAGE; release codemode first"
            exit 1
          fi
          echo "name=@shiftlabs/$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "dir=packages/$PACKAGE" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      # A package is tested against the codemode built from the same commit.
      - run: bun --filter @shiftlabs/codemode build
      - run: bun run --filter '${{ steps.package.outputs.name }}' typecheck
      - run: bun run --filter '${{ steps.package.outputs.name }}' test
      - name: Publish to npm
        working-directory: ${{ steps.package.outputs.dir }}
        run: |
          if echo "${{ github.ref_name }}" | grep -qE '(rc|alpha|beta)'; then
            npm publish --tag next --access public
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.SHIFTLABS_NPM_TOKEN }}
      # Codemode's own release stays the repository's latest.
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: false
